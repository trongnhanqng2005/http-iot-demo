<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTTP & IoT Auth Lab</title>
    <meta name="description" content="Ứng dụng trực quan hóa giao thức HTTP/HTTPS, vòng đời Request/Response và quy trình xác thực Token/JWT cho lập trình viên IoT." />
    <meta property="og:title" content="HTTP & IoT Auth Lab" />
    <meta property="og:description" content="Ứng dụng trực quan hóa giao thức HTTP/HTTPS, vòng đời Request/Response và quy trình xác thực Token/JWT cho lập trình viên IoT." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('http_iot_lab_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 antialiased min-h-screen font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
